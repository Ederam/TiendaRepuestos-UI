<!-- Panel Izquierdo: Catálogo y Búsqueda -->
<section class="catalog-section">
    <div class="search-header">
        <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
            <mat-label>Buscar repuesto (código o descripción)</mat-label>
            <input matInput [formControl]="searchControl" placeholder="Ej: Bomba gasolina, 7701..."
                autocomplete="off" />
            <mat-icon matPrefix>search</mat-icon>
            @if (searchControl.value) {
            <button mat-icon-button matSuffix (click)="searchControl.setValue('')" aria-label="Limpiar búsqueda">
                <mat-icon>close</mat-icon>
            </button>
            }
        </mat-form-field>
    </div>

    @if (isBuscando()) {
    <mat-progress-bar mode="indeterminate" class="search-bar"></mat-progress-bar>
    }
